spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/gradschool;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      max-lifetime: 240000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
app:
  jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
  jwt-hours: 8
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:admin1234}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
server:
  port: ${PORT:8080}
  shutdown: graceful
