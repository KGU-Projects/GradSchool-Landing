spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/gradschool;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
app:
  jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
  jwt-hours: 8
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:admin1234}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  upload-dir: ${UPLOAD_DIR:./uploads}
